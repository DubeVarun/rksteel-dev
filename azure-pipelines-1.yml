trigger: none

pool: rksteel-local-pool
  
jobs:
  - job: terraforminitandplan
    displayName: init and plan
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'infrapipeline_sc'
        backendAzureRmResourceGroupName: 'rg-state'
        backendAzureRmStorageAccountName: 'statefilestore454'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'infrapipeline_sc'

  - job: manualvalidation
    displayName: Manual Validation
    dependsOn: terraforminitandplan
    pool: server
    steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: 'veloran@zohomail.in'
          approvers: 'veloran@zohomail.in'

  - job: terraformapply
    displayName: Terraform Apply
    dependsOn: manualvalidation
    steps:

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'infrapipeline_sc'
          backendAzureRmResourceGroupName: 'rg-state'
          backendAzureRmStorageAccountName: 'statefilestore454'
          backendAzureRmContainerName: 'tfstate'
          backendAzureRmKey: 'dev.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'apply'
          commandOptions: '-auto-approve'
          environmentServiceNameAzureRM: 'infrapipeline_sc'