trigger: none

pool: rksteel-local-pool
  
jobs:
  - job: terraforminitplan
    displayName: Terraform init and plan execution
    steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'infrapipeline_sc'
          backendAzureRmOverrideSubscriptionID: 'c94a57a8-66ad-4fe4-9d9d-e061aafd17c0'
          backendAzureRmResourceGroupName: 'rg-state'
          backendAzureRmStorageAccountName: 'statefilestore454'
          backendAzureRmContainerName: 'tfstate'
          backendAzureRmKey: 'rk.dev.tfstate'

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'validate'

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          environmentServiceNameAzureRM: 'infrapipeline_sc'

  - job: terraformapply
    displayName: Terraform Apply
    steps:

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'infrapipeline_sc'
          backendAzureRmOverrideSubscriptionID: 'c94a57a8-66ad-4fe4-9d9d-e061aafd17c0'
          backendAzureRmResourceGroupName: 'rg-state'
          backendAzureRmStorageAccountName: 'statefilestore454'
          backendAzureRmContainerName: 'tfstate'
          backendAzureRmKey: 'rk.dev.tfstate'

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'apply'
          commandOptions: '--auto-aaprove'
          environmentServiceNameAzureRM: 'infrapipeline_sc'



          