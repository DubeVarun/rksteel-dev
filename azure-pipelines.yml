trigger: none

pool: rksteel-local-pool
  
stages:
- stage:
  jobs:
    - job: terraforminitandplan
      displayName: Terraform init and plan execution
      steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'infrapipeline_sc'
            backendAzureRmOverrideSubscriptionID: 'c94a57a8-66ad-4fe4-9d9d-e061aafd17c0'
            backendAzureRmResourceGroupName: 'rg-state'
            backendAzureRmStorageAccountName: 'statefilestore454'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'rk.dev.tfstate'


        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'


        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'infrapipeline_sc'

- stage:
  jobs:
    - job: manualvalidation
      displayName: Manual Validation
      pool: server
      steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'veloran@zohomail.in'
            approvers: 'veloran@zohomail.in'

- stage:
  jobs:
    - job: terraformapply
      displayName: Terraform Apply
      steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'infrapipeline_sc'
            backendAzureRmOverrideSubscriptionID: 'c94a57a8-66ad-4fe4-9d9d-e061aafd17c0'
            backendAzureRmResourceGroupName: 'rg-state'
            backendAzureRmStorageAccountName: 'statefilestore454'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'rk.dev.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'infrapipeline_sc'




          